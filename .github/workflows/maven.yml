name: Java CI with Maven

on:
  push:
    branches: [ "test_dwa_JAVA" ]
  pull_request:
    branches: [ "test_dwa_JAVA" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=satek233_IO_KSS -Dsonar.projectName=IO_KSS -Dsonar.organization=satek233 -Dsonar.host.url=https://sonarcloud.io



